<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Question Bank Management</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  >
  <style>
    body {
      padding: 2rem;
    }
    .badge-unapproved {
      background-color: #ffc107;
    }
  </style>
  <button onclick="goToDashboard()" style="margin-bottom: 20px;">⬅️ Back to Admin Dashboard</button>

<script>
  function goToDashboard() {
    window.location.href = '/admin-dashboard.html';
  }
</script>

</head>
<body>
  <h1 class="mb-4">Admin – Question Bank</h1>

  <div class="mb-3">
    <button class="btn btn-primary" onclick="fetchQuestions()">Refresh</button>
  </div>

  <div class="table-responsive">
    <table class="table table-bordered table-hover" id="questionTable">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Text</th>
          <th>Type</th>
          <th>Specialty</th>
          <th>Suggested By</th>
          <th>Approved</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="questionBody"></tbody>
    </table>
  </div>

  <script>
    const token = localStorage.getItem('token'); // ensure token is stored on login

    async function fetchQuestions() {
      const res = await fetch('/api/admin/questions', {
        headers: { Authorization: 'Bearer ' + token }
      });

      const questions = await res.json();
      const body = document.getElementById('questionBody');
      body.innerHTML = '';

      questions.forEach(q => {
        const row = document.createElement('tr');

        row.innerHTML = `
          <td>${q.id}</td>
          <td>${q.question_text}</td>
          <td>${q.question_type}</td>
          <td>${q.specialty || '-'}</td>
          <td>${q.suggested_by || '-'}</td>
          <td>
            ${q.is_approved ? 
              '<span class="badge bg-success">Yes</span>' :
              '<span class="badge badge-unapproved">No</span>'
            }
          </td>
          <td>
            ${!q.is_approved ? `<button class="btn btn-sm btn-success" onclick="approve(${q.id})">Approve</button>` : ''}
            <button class="btn btn-sm btn-danger" onclick="remove(${q.id})">Delete</button>
          </td>
        `;
        body.appendChild(row);
      });
    }

    async function approve(id) {
      const confirmed = confirm('Approve this question?');
      if (!confirmed) return;

      const res = await fetch(`/api/admin/questions/${id}/approve`, {
        method: 'PUT',
        headers: { Authorization: 'Bearer ' + token }
      });

      if (res.ok) {
        alert('Approved!');
        fetchQuestions();
      } else {
        alert('Approval failed');
      }
    }

    async function remove(id) {
      const confirmed = confirm('Are you sure you want to delete this question?');
      if (!confirmed) return;

      const res = await fetch(`/api/admin/questions/${id}`, {
        method: 'DELETE',
        headers: { Authorization: 'Bearer ' + token }
      });

      if (res.ok) {
        alert('Deleted');
        fetchQuestions();
      } else {
        alert('Delete failed');
      }
    }

    // Initial load
    fetchQuestions();
  </script>
</body>
</html>
