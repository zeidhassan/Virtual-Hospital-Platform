<div class="panel-container">
  <h2>Medical Records Panel</h2>
  
  <label for="sort">Sort</label>
  <input type="text" id="sort" placeholder="Enter sort order (default: +id)">

  <label for="page">Page</label>
  <input type="number" id="page" placeholder="Enter page number (default: 1)">

  <label for="limit">Limit</label>
  <input type="number" id="limit" placeholder="Enter limit (default: 10)">

  <label for="id">Record ID</label>
  <input type="number" id="id" placeholder="Enter record ID">

  <label for="patient_id">Patient ID</label>
  <input type="number" id="patient_id" placeholder="Enter patient ID">

  <label for="appointment_id">Appointment ID</label>
  <input type="number" id="appointment_id" placeholder="Enter appointment ID">

  <label for="doctor_id">Doctor ID</label>
  <input type="number" id="doctor_id" placeholder="Enter doctor ID">

  <label for="record_type">Record Type</label>
  <input type="text" id="record_type" placeholder="e.g., diagnosis, lab result">

  <label for="description">Description</label>
  <textarea id="description" placeholder="Enter record description"></textarea>

  <label for="file_url">File URL</label>
  <input type="text" id="file_url" placeholder="Enter file download link or path">

  <label for="private">Private</label>
  <input type="text" id="private" placeholder="Enter 'True' or 'False'">

  <button>Get All Records</button>
  <button>Get Record by ID</button>
  <button>Create Record</button>
  <button>Update Record</button>
  <button>Delete Record</button>
</div>
