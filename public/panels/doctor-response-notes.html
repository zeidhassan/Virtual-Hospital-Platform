<div class="panel-container">
  <h2>Doctor Response Notes Panel</h2>
  
  <label for="sort">Sort</label>
  <input type="text" id="sort" placeholder="Enter sort order (default: +id)">

  <label for="page">Page</label>
  <input type="number" id="page" placeholder="Enter page number (default: 1)">

  <label for="limit">Limit</label>
  <input type="number" id="limit" placeholder="Enter limit (default: 10)">

  <label for="id">Note ID</label>
  <input type="number" id="id" placeholder="Enter note ID">

  <label for="doctor_id">Doctor ID</label>
  <input type="number" id="doctor_id" placeholder="Enter doctor ID">

  <label for="response_id">Response ID</label>
  <input type="number" id="response_id" placeholder="Enter response ID">

  <label for="note">Note</label>
  <input type="text" id="note" placeholder="Enter note">

  <label for="created_at">Created At</label>
  <input type="text" id="created_at" placeholder="Auto-generated" disabled>

  <button>Get All Doctor Response Notes</button>
  <button>Get Doctor Response Notes by ID</button>
  <button>Create Doctor Response Notes</button>
  <button>Update Doctor Response Notes</button>
  <button>Delete Doctor Response Notes</button>
</div>
