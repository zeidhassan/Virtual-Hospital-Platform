<div class="panel-container">
  <h2>Plans Panel</h2>
  
  <label for="sort">Sort</label>
  <input type="text" id="sort" placeholder="Enter sort order (default: +id)">

  <label for="page">Page</label>
  <input type="number" id="page" placeholder="Enter page number (default: 1)">

  <label for="limit">Limit</label>
  <input type="number" id="limit" placeholder="Enter limit (default: 10)">

  <label for="id">Plan ID</label>
  <input type="number" id="id" placeholder="Enter plan ID">

  <label for="name">Plan Name</label>
  <input type="text" id="name" placeholder="Enter plan name">

  <label for="description">Description</label>
  <input type="text" id="description" placeholder="Enter description">

  <label for="price">Price</label>
  <input type="number" id="price" placeholder="Enter price" min="0" step="0.01">

  <label for="duration">Duration (days)</label>
  <input type="number" id="duration" placeholder="Enter duration in days" min="1">

  <label for="features">Features (comma separated)</label>
  <input type="text" id="features" placeholder="Enter features">

  <label for="currency">Currency</label>
  <input type="text" id="currency" placeholder="Enter currency (default: SAR)">

  <button>Get All Plans</button>
  <button>Get Plan by ID</button>
  <button>Create Plan</button>
  <button>Update Plan</button>
  <button>Delete Plan</button>
</div>
