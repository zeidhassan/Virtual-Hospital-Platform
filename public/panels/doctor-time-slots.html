<div class="panel-container">
  <h2>Doctor Time Slots Panel</h2>
  
  <label for="sort">Sort</label>
  <input type="text" id="sort" placeholder="Enter sort order (default: +id)">

  <label for="page">Page</label>
  <input type="number" id="page" placeholder="Enter page number (default: 1)">

  <label for="limit">Limit</label>
  <input type="number" id="limit" placeholder="Enter limit (default: 10)">

  <label for="id">Slot ID</label>
  <input type="number" id="id" placeholder="Enter Slot ID">

  <label for="doctor_id">Doctor ID</label>
  <input type="number" id="doctor_id" placeholder="Enter Doctor ID">

  <label for="day_of_week">Day of the Week</label>
  <input type="text" id="day_of_week" placeholder="e.g., Monday, Tuesday">

  <label for="start_time">Start Time</label>
  <input type="time" id="start_time">

  <label for="end_time">End Time</label>
  <input type="time" id="end_time">

  <label for="search-type">Search By</label>
  <select id="search-type">
    <option value="name">Name</option>
    <option value="day">Day</option>
    <option value="time">Time</option>
  </select>

  <label for="search">Search</label>
  <input type="text" id="search" placeholder="Search by Name, Day, or Time">
  <button id="search-doctor-time-slots">Search Doctor Time Slots</button>

  <button>Get All Doctor Time Slots</button>
  <button>Get Doctor Time Slots by ID</button>
  <button>Create Doctor Time Slots</button>
  <button>Update Doctor Time Slots</button>
  <button>Delete Doctor Time Slots</button>
</div>
