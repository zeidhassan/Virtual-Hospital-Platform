<div class="panel-container">
  <h2>Users Panel</h2>

  <label for="sort">Sort</label>
  <input type="text" id="sort" placeholder="Enter sort order (default: +id)">

  <label for="page">Page</label>
  <input type="number" id="page" placeholder="Enter page number (default: 1)">

  <label for="limit">Limit</label>
  <input type="number" id="limit" placeholder="Enter limit (default: 10)">

  <label for="id">User ID</label>
  <input type="number" id="id" placeholder="Enter user ID">

  <label for="full_name">Full Name</label>
  <input type="text" id="full_name" placeholder="Enter full name">

  <label for="email">Email</label>
  <input type="email" id="email" placeholder="Enter email address">

  <label for="password_hash">Password</label>
  <input type="text" id="password" placeholder="Enter password">

  <label for="role">Role</label>
  <input type="text" id="role" placeholder="e.g., admin, doctor, patient">

  <label for="phone">Phone</label>
  <input type="text" id="phone" placeholder="Enter phone number">

  <label for="gender">Gender</label>
  <input type="text" id="gender" placeholder="Enter gender (e.g., male, female)">

  <label for="date_of_birth">Date of Birth</label>
  <input type="date" id="date_of_birth">

  <label for="search_name">Search by Name</label>
  <input type="text" id="search_name" placeholder="Enter full or partial name">
  <button id="search-users">Search Users</button>

  <button>Get All Users</button>
  <button>Get Users by ID</button>
  <button>Create Users</button>
  <button>Update Users</button>
  <button>Delete Users</button>
</div>
