<div class="panel-container">
  <h2>Appointments Panel</h2>
  
  <label for="sort">Sort</label>
  <input type="text" id="sort" placeholder="Enter sort order (default: +id)">

  <label for="page">Page</label>
  <input type="number" id="page" placeholder="Enter page number (default: 1)">

  <label for="limit">Limit</label>
  <input type="number" id="limit" placeholder="Enter limit (default: 10)">

  <label for="id">Appointment ID</label>
  <input type="number" id="id" placeholder="Enter appointment ID">

  <label for="patient_id">Patient ID</label>
  <input type="number" id="patient_id" placeholder="Enter patient ID">

  <label for="doctor_id">Doctor ID</label>
  <input type="number" id="doctor_id" placeholder="Enter doctor ID">

  <label for="appointment_date">Appointment Date</label>
  <input type="date" id="appointment_date">

  <label for="appointment_start_time">Appointment Start Time</label>
  <input type="time" id="appointment_start_time">

  <label for="appointment_end_time">Appointment End Time</label>
  <input type="time" id="appointment_end_time">

  <label for="status">Status</label>
  <input type="text" id="status" placeholder="e.g., pending, confirmed, cancelled">

  <label for="notes">Notes</label>
  <textarea id="notes" placeholder="Enter appointment notes (optional)"></textarea>

  <button>Get All Appointments</button>
  <button>Get Appointment by ID</button>
  <button>Create Appointment</button>
  <button>Update Appointment</button>
  <button>Delete Appointment</button>
</div>
