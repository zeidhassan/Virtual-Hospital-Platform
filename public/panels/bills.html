<div class="panel-container">
  <h2>Bills Panel</h2>
  
  <label for="sort">Sort</label>
  <input type="text" id="sort" placeholder="Enter sort order (default: +id)">

  <label for="page">Page</label>
  <input type="number" id="page" placeholder="Enter page number (default: 1)">

  <label for="limit">Limit</label>
  <input type="number" id="limit" placeholder="Enter limit (default: 10)">

  <label for="id">Bill ID</label>
  <input type="number" id="id" placeholder="Enter bill ID">

  <label for="patient_id">Patient ID</label>
  <input type="number" id="patient_id" placeholder="Enter patient ID">

  <label for="amount">Amount</label>
  <input type="number" id="amount" step="0.01" placeholder="Enter bill amount">

  <label for="status">Status</label>
  <input type="text" id="status" placeholder="e.g., paid, pending">

  <label for="billing_date">Billing Date</label>
  <input type="date" id="billing_date">

  <label for="details">Details</label>
  <textarea id="details" placeholder="Enter billing details"></textarea>

  <button>Get All Bills</button>
  <button>Get Bill by ID</button>
  <button>Create Bill</button>
  <button>Update Bill</button>
  <button>Delete Bill</button>
</div>
