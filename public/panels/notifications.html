<div class="panel-container">
  <h2>Notifications Panel</h2>
  
  <label for="sort">Sort</label>
  <input type="text" id="sort" placeholder="Enter sort order (default: +id)">

  <label for="page">Page</label>
  <input type="number" id="page" placeholder="Enter page number (default: 1)">

  <label for="limit">Limit</label>
  <input type="number" id="limit" placeholder="Enter limit (default: 10)">

  <label for="id">Notification ID</label>
  <input type="number" id="id" placeholder="Enter notification ID">

  <label for="user_id">User ID</label>
  <input type="number" id="user_id" placeholder="Enter user ID">

  <label for="title">Title</label>
  <input type="text" id="title" placeholder="Enter notification title">

  <label for="body">Body</label>
  <textarea id="body" placeholder="Enter notification body"></textarea>

  <label for="is_read">Is Read</label>
  <select id="is_read">
    <option value="false" selected>Unread</option>
    <option value="true">Read</option>
  </select>

  <button>Get All Notifications</button>
  <button>Get Notification by ID</button>
  <button>Create Notification</button>
  <button>Update Notification</button>
  <button>Delete Notification</button>
</div>
