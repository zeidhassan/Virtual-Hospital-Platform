<div class="panel-container">
  <h2>Patient Question Responses Panel</h2>
  
  <label for="sort">Sort</label>
  <input type="text" id="sort" placeholder="Enter sort order (default: +id)">

  <label for="page">Page</label>
  <input type="number" id="page" placeholder="Enter page number (default: 1)">

  <label for="limit">Limit</label>
  <input type="number" id="limit" placeholder="Enter limit (default: 10)">

  <label for="id">Response ID</label>
  <input type="number" id="id" placeholder="Enter response ID">

  <label for="patient_id">Patient ID</label>
  <input type="number" id="patient_id" placeholder="Enter patient ID">

  <label for="question_id">Question ID</label>
  <input type="number" id="question_id" placeholder="Enter question ID">

  <label for="answer">Answer</label>
  <input type="text" id="answer" placeholder="Enter answer">

  <label for="created_at">Created At</label>
  <input type="text" id="created_at" placeholder="Auto-generated" disabled>

  <button>Get All Patient Question Responses</button>
  <button>Get Patient Question Responses by ID</button>
  <button>Create Patient Question Responses</button>
  <button>Update Patient Question Responses</button>
  <button>Delete Patient Question Responses</button>
</div>
