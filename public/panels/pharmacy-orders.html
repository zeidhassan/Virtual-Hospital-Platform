<div class="panel-container">
  <h2>Pharmacy Orders Panel</h2>
  
  <label for="sort">Sort</label>
  <input type="text" id="sort" placeholder="Enter sort order (default: +id)">

  <label for="page">Page</label>
  <input type="number" id="page" placeholder="Enter page number (default: 1)">

  <label for="limit">Limit</label>
  <input type="number" id="limit" placeholder="Enter limit (default: 10)">

  <label for="id">Order ID</label>
  <input type="number" id="id" placeholder="Enter order ID">

  <label for="patient_id">Patient ID</label>
  <input type="number" id="patient_id" placeholder="Enter patient ID">

  <label for="medications">Medications</label>
  <input type="text" id="medications" placeholder="e.g., Ibuprofen, Paracetamol">

  <label for="total_amount">Total Amount</label>
  <input type="number" id="total_amount" placeholder="Enter total amount" step="0.01">

  <label for="status">Status</label>
  <input type="text" id="status" placeholder="e.g., pending, delivered">

  <label for="order_date">Order Date</label>
  <input type="date" id="order_date">

  <button>Get All Pharmacy Orders</button>
  <button>Get Pharmacy Order by ID</button>
  <button>Create Pharmacy Order</button>
  <button>Update Pharmacy Order</button>
  <button>Delete Pharmacy Order</button>
</div>
