<div class="panel-container">
  <h2>Doctors Panel</h2>

  <label for="sort">Sort</label>
  <input type="text" id="sort" placeholder="Enter sort order (default: +id)">

  <label for="page">Page</label>
  <input type="number" id="page" placeholder="Enter page number (default: 1)">

  <label for="limit">Limit</label>
  <input type="number" id="limit" placeholder="Enter limit (default: 10)">

  <label for="id">Doctor ID</label>
  <input type="number" id="id" placeholder="Enter doctor ID">

  <label for="user_id">User ID</label>
  <input type="number" id="user_id" placeholder="Enter user ID">

  <label for="specialization">Specialization</label>
  <input type="text" id="specialization" placeholder="e.g., Cardiologist, Dentist">

  <label for="qualifications">Qualifications</label>
  <input type="text" id="qualifications" placeholder="e.g., MBBS, MD">

  <label for="availability_status">Availability Status</label>
  <input type="text" id="availability_status" placeholder="e.g., available, on leave">

  <label for="profile_picture_url">Profile Picture URL</label>
  <input type="text" id="profile_picture_url" placeholder="Enter image URL">

  <label for="bio">Bio</label>
  <textarea id="bio" placeholder="Enter short bio or description"></textarea>

  <label for="search_name">Search by Name</label>
  <input type="text" id="search_name" placeholder="Enter full or partial name">
  <button id="search-doctors">Search Doctors</button>

  <button>Get All Doctors</button>
  <button>Get Doctor by ID</button>
  <button>Create Doctor</button>
  <button>Update Doctor</button>
  <button>Delete Doctor</button>
</div>
