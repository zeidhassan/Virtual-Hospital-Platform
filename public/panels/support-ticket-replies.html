<div class="panel-container">
  <h2>Support Ticket Replies Panel</h2>
  
  <label for="sort">Sort</label>
  <input type="text" id="sort" placeholder="Enter sort order (default: +id)">

  <label for="page">Page</label>
  <input type="number" id="page" placeholder="Enter page number (default: 1)">

  <label for="limit">Limit</label>
  <input type="number" id="limit" placeholder="Enter limit (default: 10)">

  <label for="id">Reply ID</label>
  <input type="number" id="id" placeholder="Enter reply ID">

  <label for="ticket_id">Ticket ID</label>
  <input type="number" id="ticket_id" placeholder="Enter ticket ID">

  <label for="user_id">User ID</label>
  <input type="number" id="user_id" placeholder="Enter user ID">

  <label for="message">Message</label>
  <input type="text" id="message" placeholder="Enter reply message">

  <label for="file_url">File URL</label>
  <textarea id="file_url" placeholder="Enter file URL"></textarea>

  <button>Get All Support Ticket Replies</button>
  <button>Get Support Ticket Reply by ID</button>
  <button>Create Support Ticket Reply</button>
  <button>Update Support Ticket Reply</button>
  <button>Delete Support Ticket Reply</button>
</div>
