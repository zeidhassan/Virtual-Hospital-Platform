<div class="panel-container">
  <h2>Patients Panel</h2>

  <label for="sort">Sort</label>
  <input type="text" id="sort" placeholder="Enter sort order (default: +id)">

  <label for="page">Page</label>
  <input type="number" id="page" placeholder="Enter page number (default: 1)">
  
  <label for="limit">Limit</label>
  <input type="number" id="limit" placeholder="Enter limit (default: 10)">

  <label for="id">Patient ID</label>
  <input type="number" id="id" placeholder="Enter patient ID">

  <label for="user_id">User ID</label>
  <input type="number" id="user_id" placeholder="Enter user ID">

  <label for="blood_group">Blood Group</label>
  <input type="text" id="blood_group" placeholder="e.g., A+, B-, O+">

  <label for="emergency_contact_name">Emergency Contact Name</label>
  <input type="text" id="emergency_contact_name" placeholder="Enter emergency contact name">

  <label for="emergency_contact_phone">Emergency Contact Phone</label>
  <input type="text" id="emergency_contact_phone" placeholder="Enter emergency contact number">

  <label for="address">Address</label>
  <input type="text" id="address" placeholder="Enter patient address">

  <label for="allergies">Allergies</label>
  <input type="text" id="allergies" placeholder="Enter known allergies">

  <label for="chronic_conditions">Chronic Conditions</label>
  <input type="text" id="chronic_conditions" placeholder="Enter chronic conditions">

  <label for="search_name">Search by Name</label>
  <input type="text" id="search_name" placeholder="Enter full or partial name">
  <button id="search-patients">Search Patients</button>
  
  <button>Get All Patients</button>
  <button>Get Patient by ID</button>
  <button>Create Patient</button>
  <button>Update Patient</button>
  <button>Delete Patient</button>
</div>
