<div class="panel-container">
  <h2>Health Programs Panel</h2>
  
  <label for="sort">Sort</label>
  <input type="text" id="sort" placeholder="Enter sort order (default: +id)">

  <label for="page">Page</label>
  <input type="number" id="page" placeholder="Enter page number (default: 1)">

  <label for="limit">Limit</label>
  <input type="number" id="limit" placeholder="Enter limit (default: 10)">

  <label for="id">Program ID</label>
  <input type="number" id="id" placeholder="Enter program ID">

  <label for="name">Name</label>
  <input type="text" id="name" placeholder="Enter program name">

  <label for="description">Description</label>
  <textarea id="description" placeholder="Enter program description"></textarea>

  <label for="start_date">Start Date</label>
  <input type="date" id="start_date">

  <label for="end_date">End Date</label>
  <input type="date" id="end_date">

  <label for="eligibility">Eligibility</label>
  <input type="text" id="eligibility" placeholder="e.g., All patients, Adults 40+">

  <button>Get All Programs</button>
  <button>Get Program by ID</button>
  <button>Create Program</button>
  <button>Update Program</button>
  <button>Delete Program</button>
</div>
