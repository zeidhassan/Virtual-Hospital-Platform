<div class="panel-container">
  <h2>Services Panel</h2>
  
  <label for="sort">Sort</label>
  <input type="text" id="sort" placeholder="Enter sort order (default: +id)">

  <label for="page">Page</label>
  <input type="number" id="page" placeholder="Enter page number (default: 1)">

  <label for="limit">Limit</label>
  <input type="number" id="limit" placeholder="Enter limit (default: 10)">

  <label for="id">Service ID</label>
  <input type="number" id="id" placeholder="Enter service ID">

  <label for="name">Name</label>
  <input type="text" id="name" placeholder="Enter service name">

  <label for="description">Description</label>
  <textarea id="description" placeholder="Enter service description"></textarea>

  <label for="cost">Cost</label>
  <input type="number" id="cost" step="0.01" placeholder="Enter cost">

  <button>Get All Services</button>
  <button>Get Service by ID</button>
  <button>Create Service</button>
  <button>Update Service</button>
  <button>Delete Service</button>
</div>
