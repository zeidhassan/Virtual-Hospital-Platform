<div class="panel-container">
  <h2>Prescriptions Panel</h2>
  
  <label for="sort">Sort</label>
  <input type="text" id="sort" placeholder="Enter sort order (default: +id)">

  <label for="page">Page</label>
  <input type="number" id="page" placeholder="Enter page number (default: 1)">

  <label for="limit">Limit</label>
  <input type="number" id="limit" placeholder="Enter limit (default: 10)">

  <label for="id">Prescription ID</label>
  <input type="number" id="id" placeholder="Enter prescription ID">

  <label for="appointment_id">Appointment ID</label>
  <input type="number" id="appointment_id" placeholder="Enter appointment ID">

  <label for="medication">Medication</label>
  <input type="text" id="medication" placeholder="Enter prescribed medication">

  <label for="dosage">Dosage</label>
  <input type="text" id="dosage" placeholder="e.g., 500mg, twice daily">

  <label for="instructions">Instructions</label>
  <textarea id="instructions" placeholder="Enter instructions for patient"></textarea>

  <label for="issued_date">Issued Date</label>
  <input type="date" id="issued_date">

  <button>Get All Prescriptions</button>
  <button>Get Prescription by ID</button>
  <button>Create Prescription</button>
  <button>Update Prescription</button>
  <button>Delete Prescription</button>
</div>
