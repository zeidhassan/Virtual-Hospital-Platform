<div class="panel-container">
  <h2>Doctor Subscriptions Panel</h2>
  
  <label for="sort">Sort</label>
  <input type="text" id="sort" placeholder="Enter sort order (default: +id)">

  <label for="page">Page</label>
  <input type="number" id="page" placeholder="Enter page number (default: 1)">

  <label for="limit">Limit</label>
  <input type="number" id="limit" placeholder="Enter limit (default: 10)">

  <label for="id">Subscription ID</label>
  <input type="number" id="id" placeholder="Enter subscription ID">

  <label for="user_id">User ID</label>
  <input type="number" id="user_id" placeholder="Enter user ID">

  <label for="plan_id">Plan ID</label>
  <input type="number" id="plan_id" placeholder="Enter plan ID">

  <label for="billing_cycle">Billing Cycle</label>
  <input type="text" id="billing_cycle" placeholder="monthly or yearly">

  <label for="status">Status</label>
  <input type="text" id="status" placeholder="pending, active, etc.">

  <label for="paperwork_url">Paperwork URL</label>
  <input type="text" id="paperwork_url" placeholder="Enter paperwork URL">

  <label for="start_date">Start Date</label>
  <input type="date" id="start_date">

  <label for="end_date">End Date</label>
  <input type="date" id="end_date">

  <label for="admin_notes">Admin Notes</label>
  <input type="text" id="admin_notes" placeholder="Enter admin notes">

  <label for="created_at">Created At</label>
  <input type="text" id="created_at" placeholder="Auto-generated" disabled>

  <label for="updated_at">Updated At</label>
  <input type="text" id="updated_at" placeholder="Auto-generated" disabled>

  <button>Get All Doctor Subscriptions</button>
  <button>Get Doctor Subscriptions by ID</button>
  <button>Create Doctor Subscriptions</button>
  <button>Update Doctor Subscriptions</button>
  <button>Delete Doctor Subscriptions</button>
</div>
