<div class="panel-container">
  <h2>Appointment Status Logs</h2>

  <label for="sort">Sort</label>
  <input type="text" id="sort" placeholder="Enter sort order (default: +id)">

  <label for="page">Page</label>
  <input type="number" id="page" placeholder="Enter page number (default: 1)">

  <label for="limit">Limit</label>
  <input type="number" id="limit" placeholder="Enter limit (default: 10)">

  <label for="id">Log ID</label>
  <input type="number" id="id" placeholder="Enter Log ID">

  <label for="appointment_id">Appointment ID</label>
  <input type="number" id="appointment_id" placeholder="Enter Appointment ID">

  <label for="old_status">Old Status</label>
  <input type="text" id="old_status" placeholder="e.g. scheduled">

  <label for="new_status">New Status</label>
  <input type="text" id="new_status" placeholder="e.g. completed">

  <button>Get All Appointment Status Logs</button>
  <button>Get Appointment Status Logs by ID</button>
  <button>Create Appointment Status Logs</button>
  <button>Update Appointment Status Logs</button>
  <button>Delete Appointment Status Logs</button>
</div>
