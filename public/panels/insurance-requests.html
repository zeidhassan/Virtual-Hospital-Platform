<div class="panel-container">
  <h2>Insurance Requests Panel</h2>
  
  <label for="sort">Sort</label>
  <input type="text" id="sort" placeholder="Enter sort order (default: +id)">

  <label for="page">Page</label>
  <input type="number" id="page" placeholder="Enter page number (default: 1)">

  <label for="limit">Limit</label>
  <input type="number" id="limit" placeholder="Enter limit (default: 10)">

  <label for="id">Request ID</label>
  <input type="number" id="id" placeholder="Enter request ID">

  <label for="patient_id">Patient ID</label>
  <input type="number" id="patient_id" placeholder="Enter patient ID">

  <label for="doctor_id">Doctor ID</label>
  <input type="number" id="doctor_id" placeholder="Enter doctor ID">

  <label for="bill_id">Bill ID</label>
  <input type="number" id="bill_id" placeholder="Enter bill ID">

  <label for="insurance_company">Insurance Company</label>
  <input type="text" id="insurance_company" placeholder="Enter insurance company">

  <label for="insurance_id_number">Insurance ID Number</label>
  <input type="text" id="insurance_id_number" placeholder="Enter insurance ID number">

  <label for="start_date">Start Date</label>
  <input type="date" id="start_date">

  <label for="end_date">End Date</label>
  <input type="date" id="end_date">

  <label for="status">Status</label>
  <input type="text" id="status" placeholder="pending, accepted, rejected">

  <label for="created_at">Created At</label>
  <input type="text" id="created_at" placeholder="Auto-generated" disabled>

  <button>Get All Insurance Requests</button>
  <button>Get Insurance Requests by ID</button>
  <button>Create Insurance Requests</button>
  <button>Update Insurance Requests</button>
  <button>Delete Insurance Requests</button>
</div>
