<div class="panel-container">
  <h2>Question Bank Panel</h2>
  
  <label for="sort">Sort</label>
  <input type="text" id="sort" placeholder="Enter sort order (default: +id)">

  <label for="page">Page</label>
  <input type="number" id="page" placeholder="Enter page number (default: 1)">

  <label for="limit">Limit</label>
  <input type="number" id="limit" placeholder="Enter limit (default: 10)">

  <label for="id">Question ID</label>
  <input type="number" id="id" placeholder="Enter question ID">

  <label for="question_text">Question Text</label>
  <input type="text" id="question_text" placeholder="Enter question text">

  <label for="question_type">Question Type</label>
  <input type="text" id="question_type" placeholder="public or specialty">

  <label for="specialty">Specialty</label>
  <input type="text" id="specialty" placeholder="Enter specialty (if applicable)">

  <label for="suggested_by">Suggested By (Doctor ID)</label>
  <input type="number" id="suggested_by" placeholder="Enter doctor ID">

  <label for="is_approved">Is Approved</label>
  <select id="is_approved">
    <option value="true">True</option>
    <option value="false">False</option>
  </select>

  <label for="created_at">Created At</label>
  <input type="text" id="created_at" placeholder="Auto-generated" disabled>

  <button>Get All Question Bank</button>
  <button>Get Question Bank by ID</button>
  <button>Create Question Bank</button>
  <button>Update Question Bank</button>
  <button>Delete Question Bank</button>
</div>
