<div class="panel-container">
  <h2>Support Tickets Panel</h2>
  
  <label for="sort">Sort</label>
  <input type="text" id="sort" placeholder="Enter sort order (default: +id)">

  <label for="page">Page</label>
  <input type="number" id="page" placeholder="Enter page number (default: 1)">

  <label for="limit">Limit</label>
  <input type="number" id="limit" placeholder="Enter limit (default: 10)">

  <label for="id">Ticket ID</label>
  <input type="number" id="id" placeholder="Enter ticket ID">

  <label for="user_id">User ID</label>
  <input type="number" id="user_id" placeholder="Enter user ID">

  <label for="subject">Subject</label>
  <input type="text" id="subject" placeholder="Enter ticket subject">

  <label for="description">Description</label>
  <textarea id="description" placeholder="Enter issue description"></textarea>

  <label for="status">Status</label>
  <input type="text" id="status" placeholder="e.g., open, resolved">

  <label for="doctor_assigned">Assigned Doctor</label>
  <input type="number" id="doctor_assigned" placeholder="Enter doctor ID">

  <label for="patient_assigned">Assigned Patient</label>
  <input type="number" id="patient_assigned" placeholder="Enter patient ID">

  <button>Get All Support Tickets</button>
  <button>Get Support Ticket by ID</button>
  <button>Create Support Ticket</button>
  <button>Update Support Ticket</button>
  <button>Delete Support Ticket</button>
</div>
