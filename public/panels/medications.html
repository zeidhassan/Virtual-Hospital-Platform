<div class="panel-container">
  <h2>Medications Panel</h2>
  
  <label for="sort">Sort</label>
  <input type="text" id="sort" placeholder="Enter sort order (default: +id)">

  <label for="page">Page</label>
  <input type="number" id="page" placeholder="Enter page number (default: 1)">

  <label for="limit">Limit</label>
  <input type="number" id="limit" placeholder="Enter limit (default: 10)">

  <label for="id">Medication ID</label>
  <input type="number" id="id" placeholder="Enter medication ID">

  <label for="name">Name</label>
  <input type="text" id="name" placeholder="Enter medication name">

  <label for="type">Type</label>
  <input type="text" id="type" placeholder="Enter medication type ('countertop', 'prescription')">

  <label for="description">Description</label>
  <input type="text" id="description" placeholder="Enter description">

  <label for="price">Price</label>
  <input type="number" id="price" placeholder="Enter price" min="0" step="0.01">

  <button>Get All Medications</button>
  <button>Get Medication by ID</button>
  <button>Create Medication</button>
  <button>Update Medication</button>
  <button>Delete Medication</button>
</div>
