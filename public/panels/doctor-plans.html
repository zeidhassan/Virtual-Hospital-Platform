<div class="panel-container">
  <h2>Doctor Plans Panel</h2>
  
  <label for="sort">Sort</label>
  <input type="text" id="sort" placeholder="Enter sort order (default: +id)">

  <label for="page">Page</label>
  <input type="number" id="page" placeholder="Enter page number (default: 1)">

  <label for="limit">Limit</label>
  <input type="number" id="limit" placeholder="Enter limit (default: 10)">

  <label for="id">Plan ID</label>
  <input type="number" id="id" placeholder="Enter plan ID">

  <label for="name">Name</label>
  <input type="text" id="name" placeholder="Enter plan name">

  <label for="description">Description</label>
  <input type="text" id="description" placeholder="Enter description">

  <label for="monthly_price">Monthly Price</label>
  <input type="number" id="monthly_price" placeholder="Enter monthly price" min="0" step="0.01">

  <label for="yearly_price">Yearly Price</label>
  <input type="number" id="yearly_price" placeholder="Enter yearly price" min="0" step="0.01">

  <label for="features">Features (JSON)</label>
  <input type="text" id="features" placeholder="Enter features as JSON">

  <label for="currency">Currency</label>
  <input type="text" id="currency" placeholder="Enter currency (default: SAR)">

  <label for="created_at">Created At</label>
  <input type="text" id="created_at" placeholder="Auto-generated" disabled>

  <button>Get All Doctor Plans</button>
  <button>Get Doctor Plans by ID</button>
  <button>Create Doctor Plans</button>
  <button>Update Doctor Plans</button>
  <button>Delete Doctor Plans</button>
</div>
