<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard | Virtual Hospital Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
  body {
    margin: 0;
    padding: 1rem;
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }

  .dashboard {
    background: #fff;
    padding: 2rem;
    border-radius: 10px;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 500px;
    box-sizing: border-box;
  }

  h1 {
    text-align: center;
    margin-bottom: 1.5rem;
    font-size: 24px;
    color: #333;
  }

  button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 6px;
    margin: 8px 0;
    cursor: pointer;
    transition: background-color 0.2s ease;
  }

  button:hover {
    background-color: #0056b3;
  }

  .logout-btn {
    background-color: #6c757d;
  }

  .logout-btn:hover {
    background-color: #5a6268;
  }

  hr {
    margin: 20px 0;
  }

  @media screen and (max-width: 480px) {
    .dashboard {
      padding: 1.2rem;
    }

    button {
      font-size: 15px;
      padding: 10px;
    }
  }
</style>
</head>
<body>
  <div class="dashboard">
    <h1>Admin Dashboard</h1>
    <button onclick="goToPage('view-profile.html')">View Profile</button>
    <button onclick="goToPage('update-profile.html')">Update Profile</button>
    <hr>
    <button onclick="goToPage('admin/database-test.html')">Database Control (Updated)</button>
    <button onclick="goToPage('admin/passwords.html')">All Passwords (Only During Development)</button>
    <button onclick="goToPage('admin/admin-appointments.html')">Appointments</button>
    <button onclick="goToPage('admin/adminOrders.html')">Manage Pharmacy Orders</button>
    <button onclick="goToPage('admin/billing.html')">Billing</button>
    <button onclick="goToPage('admin/stats.html')">Stats</button>
    <button onclick="goToPage('admin/charts.html')">Charts</button>
    <hr>
    <button onclick="goToPage('admin/admin-doctor-subscriptions.html')">Doctor Subscriptions</button>
    <button onclick="goToPage('admin/doctor-time-slots.html')">Manage Doctor Slots</button>
    <hr>
    <button onclick="goToPage('admin/insurance-admin.html')">Insurance Managament</button>
    <hr>
    <!-- 🔽 New Question System Buttons -->
    <button onclick="goToPage('admin/questions.html')">View Questions</button>
    <button onclick="goToPage('admin/suggested-questions.html')">Suggested Questions</button>
    <hr>
    <button onclick="goToPage('http://localhost:5000/api-docs')">API Documentation</button>
    <hr>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <script>
    function goToPage(path) {
      window.location.href = path;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (token) {
      localStorage.setItem('token', token);

      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        if (payload.role) localStorage.setItem('userRole', payload.role);
        if (payload.id) localStorage.setItem('userId', payload.id);
      } catch (err) {
        console.error('Failed to decode token:', err.message);
      }

      window.history.replaceState({}, document.title, window.location.pathname);
    }

    function logout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
