<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Answer Health Questions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      padding: 2rem;
      background-color: #f0f4f8;
    }
    .container {
      max-width: 800px;
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    textarea {
      resize: vertical;
    }
    .back-btn {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="btn btn-secondary back-btn" onclick="goBack()">⬅️ Back to Dashboard</button>

    <h2 class="mb-4">Answer Health Questions</h2>

    <div class="mb-4">
      <label for="specialtySelect" class="form-label">Choose a Specialty (optional)</label>
      <select id="specialtySelect" class="form-select">
        <option value="">-- None --</option>
        <option value="cardiology">Cardiology</option>
        <option value="dermatology">Dermatology</option>
        <option value="pediatrics">Pediatrics</option>
        <option value="neurology">Neurology</option>
        <option value="endocrinology">Endocrinology</option>
      </select>
    </div>

    <form id="answerForm">
      <div id="questionsContainer"></div>
      <button type="submit" class="btn btn-success w-100 mt-3">Submit All Answers</button>
    </form>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const patientId = localStorage.getItem('userId'); 

    if (!token || !patientId) {
      alert("Unauthorized access. Please log in again.");
      window.location.href = "/login.html";
    }

    function goBack() {
      // Correct path based on your file location
      window.location.href = '/patient-dashboard.html';
    }

    const questionsContainer = document.getElementById('questionsContainer');
    const specialtySelect = document.getElementById('specialtySelect');

    async function fetchQuestions(type, specialty = null) {
      let url = '/api/questions/';
      if (type === 'public') url += 'public';
      else if (type === 'specialty' && specialty) url += `specialty/${specialty}`;
      else return [];

      const res = await fetch(url, {
        headers: {
          Authorization: `Bearer ${token}`
        }
      });
      return res.ok ? res.json() : [];
    }

    function renderQuestions(questions) {
      questionsContainer.innerHTML = ''; // Clear previous
      questions.forEach(q => {
        const div = document.createElement('div');
        div.className = 'mb-3';
        div.innerHTML = `
          <label class="form-label"><strong>${q.question_text}</strong></label>
          <textarea class="form-control" rows="2" required name="question_${q.id}" data-qid="${q.id}"></textarea>
        `;
        questionsContainer.appendChild(div);
      });
    }

    async function loadAllQuestions() {
      const specialty = specialtySelect.value;

      const publicQs = await fetchQuestions('public');
      const specialtyQs = specialty ? await fetchQuestions('specialty', specialty) : [];

      const allQs = [...(publicQs.data || []), ...(specialtyQs.data || [])];
      renderQuestions(allQs);
    }


    specialtySelect.addEventListener('change', loadAllQuestions);

    document.getElementById('answerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const answers = [];

      [...form.querySelectorAll('textarea')].forEach(txt => {
        const questionId = txt.dataset.qid;
        const answer = txt.value.trim();
        if (questionId && answer) {
          answers.push({
            question_id: parseInt(questionId),
            answer: answer
          });
        }
      });

      if (answers.length === 0) {
        return alert("Please answer at least one question.");
      }

      try {
        const res = await fetch('/api/questions/submit-answers', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify({ patient_id: patientId, answers })
        });

        const data = await res.json();
        if (res.ok) {
          alert("Answers submitted successfully!");
          form.reset();
          loadAllQuestions(); // reload updated UI
        } else {
          throw new Error(data.error || "Failed to submit.");
        }
      } catch (err) {
        alert("Error: " + err.message);
      }
    });

    // Load initial questions
    loadAllQuestions();
  </script>
</body>
</html>
