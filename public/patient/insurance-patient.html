<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Insurance Requests</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      padding: 30px;
    }
    .card {
      margin-bottom: 20px;
    }
    .badge {
      font-size: 0.9em;
    }
  </style>
</head>
<body>

<div class="container">
  <h2 class="mb-4">My Insurance Requests</h2>
  <div id="requests-container" class="row"></div>
</div>

<script>
  const token = localStorage.getItem('token');

  function getUserIdFromToken() {
    if (!token) return null;
    try {
      const payload = JSON.parse(atob(token.split('.')[1]));
      return payload.id;
    } catch {
      return null;
    }
  }

  function formatStatus(status) {
    switch (status) {
      case 'pending': return `<span class="badge bg-warning text-dark">Pending</span>`;
      case 'accepted': return `<span class="badge bg-success">Accepted</span>`;
      case 'rejected': return `<span class="badge bg-danger">Rejected</span>`;
      default: return `<span class="badge bg-secondary">Unknown</span>`;
    }
  }

  async function loadRequests() {
    const userId = getUserIdFromToken();
    if (!userId) return alert("Invalid or missing token.");

    try {
      const res = await fetch(`/api/insurance-requests/patient/${userId}`, {
        headers: {
          'Authorization': `Bearer ${token}`
        }
      });

      if (!res.ok) throw new Error("Failed to fetch insurance requests.");
      const requests = await res.json();

      const container = document.getElementById("requests-container");
      container.innerHTML = '';

      if (requests.length === 0) {
        container.innerHTML = `<p class="text-muted">You have not submitted any insurance requests.</p>`;
        return;
      }

      requests.forEach(req => {
        const col = document.createElement('div');
        col.className = 'col-md-6';

        col.innerHTML = `
          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title">${req.insurance_company}</h5>
              <p><strong>Doctor:</strong> ${req.doctor_name}</p>
              <p><strong>Bill:</strong> ${req.description}</p>
              <p><strong>Amount:</strong> ${req.amount} SAR</p>
              <p><strong>Coverage:</strong> ${req.start_date} to ${req.end_date}</p>
              <p><strong>Status:</strong> ${formatStatus(req.status)}</p>
              ${req.status === 'rejected' && req.rejection_message
                ? `<div class="alert alert-danger mt-2"><strong>Reason:</strong> ${req.rejection_message}</div>`
                : ''}
            </div>
          </div>
        `;

        container.appendChild(col);
      });

    } catch (err) {
      console.error(err);
      alert(err.message || "An error occurred.");
    }
  }

  loadRequests();
</script>

</body>
</html>
