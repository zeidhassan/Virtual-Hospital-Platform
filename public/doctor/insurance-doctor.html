<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Doctor Insurance Requests</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f5f5f5;
      padding: 30px;
    }
    .card {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="mb-4">Pending Insurance Requests</h2>
    <div id="requests-container" class="row"></div>
  </div>

  <script>
    const token = localStorage.getItem('token');

    async function getDoctorIdFromToken() {
      // Assumes JWT payload is base64 encoded JSON
      if (!token) return null;
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        return payload.id; // or payload.userId if that's how you stored it
      } catch {
        return null;
      }
    }

    async function loadRequests() {
      const doctorId = await getDoctorIdFromToken();
      if (!doctorId) return alert("Invalid or missing token.");

      try {
        const res = await fetch(`/api/insurance-requests/doctor/${doctorId}`, {
          headers: {
            Authorization: `Bearer ${token}`
          }
        });

        if (!res.ok) throw new Error("Failed to fetch requests.");
        const requests = await res.json();

        const container = document.getElementById("requests-container");
        container.innerHTML = "";

        if (requests.length === 0) {
          container.innerHTML = `<p class="text-muted">No pending requests.</p>`;
          return;
        }

        requests.forEach((req) => {
          const col = document.createElement("div");
          col.className = "col-md-6";
          col.innerHTML = `
            <div class="card shadow-sm">
              <div class="card-body">
                <h5 class="card-title">${req.insurance_company}</h5>
                <p><strong>Patient:</strong> ${req.patient_name}</p>
                <p><strong>Bill:</strong> ${req.description}</p>
                <p><strong>Amount:</strong> ${req.amount} SAR</p>
                <p><strong>Insurance ID:</strong> ${req.insurance_id_number}</p>
                <p><strong>Coverage:</strong> ${req.start_date} to ${req.end_date}</p>
                <button class="btn btn-success me-2" onclick="approveRequest(${req.id})">Approve</button>
                <button class="btn btn-danger" onclick="rejectRequest(${req.id})">Reject</button>
              </div>
            </div>
          `;
          container.appendChild(col);
        });
      } catch (err) {
        console.error(err);
        alert(err.message || "An error occurred while loading requests.");
      }
    }

    async function approveRequest(id) {
      try {
        const res = await fetch(`/api/insurance-requests/${id}/accept`, {
          method: 'POST',
          headers: {
            Authorization: `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Approval failed.");

        alert("Request approved.");
        loadRequests();
      } catch (err) {
        console.error(err);
        alert(err.message || "Error approving request.");
      }
    }

    async function rejectRequest(id) {
      const reason = prompt("Enter reason for rejection:");
      if (!reason) return alert("Rejection reason required.");

      try {
        const res = await fetch(`/api/insurance-requests/${id}/reject`, {
          method: 'POST',
          headers: {
            Authorization: `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ rejection_message: reason })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Rejection failed.");

        alert("Request rejected.");
        loadRequests();
      } catch (err) {
        console.error(err);
        alert(err.message || "Error rejecting request.");
      }
    }

    loadRequests();
  </script>
</body>
</html>
