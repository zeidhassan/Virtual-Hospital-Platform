<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Patient Answers Summary</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  >
  <style>
    body {
      padding: 2rem;
    }
    .note {
      font-style: italic;
      color: #6c757d;
    }
    #noData {
      color: #888;
      margin-top: 1rem;
      font-style: italic;
    }
  </style>
</head>
<body>
  <a href="/doctor-dashboard.html" class="btn btn-outline-primary mb-3">⬅ Back to Doctor Dashboard</a>

  <h2 class="mb-4">View Patient Answer Summary</h2>

  <div class="mb-3">
    <label for="patientId" class="form-label">Enter Patient ID:</label>
    <input type="number" id="patientId" class="form-control" placeholder="e.g. 3">
  </div>

  <button class="btn btn-primary mb-4" onclick="fetchAnswers()">Fetch Answers</button>

  <div id="resultsArea" class="table-responsive" style="display: none;">
    <table class="table table-bordered">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Question</th>
          <th>Answer</th>
          <th>Submitted At</th>
          <th>Doctor Note</th>
        </tr>
      </thead>
      <tbody id="answersBody"></tbody>
    </table>
    <div id="noData" style="display: none;">No answers found for this patient.</div>
  </div>

  <script>
    let token = localStorage.getItem('token');

    if (!token) {
      const urlParams = new URLSearchParams(window.location.search);
      token = urlParams.get('token');
      if (token) localStorage.setItem('token', token);
    }

    async function fetchAnswers() {
      const patientId = document.getElementById('patientId').value;
      const tbody = document.getElementById('answersBody');
      const resultsArea = document.getElementById('resultsArea');
      const noData = document.getElementById('noData');

      if (!patientId) {
        alert("Please enter a valid patient ID.");
        return;
      }

      if (!token) {
        alert("No token found. Please log in again.");
        return;
      }

      try {
        const res = await fetch(`/api/questions/file-summary/${patientId}`, {
          headers: {
            Authorization: `Bearer ${token}`
          }
        });

        if (!res.ok) {
          const errData = await res.json();
          alert(errData.error || "Failed to fetch data. Are you logged in as doctor?");
          return;
        }

        const data = await res.json();
        tbody.innerHTML = '';
        noData.style.display = 'none';
        resultsArea.style.display = 'block';

        if (data.length === 0) {
          noData.style.display = 'block';
          return;
        }

        data.forEach((item, index) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${index + 1}</td>
            <td>${item.question_text}</td>
            <td>${item.answer}</td>
            <td>${new Date(item.created_at).toLocaleString()}</td>
            <td>${item.note ? `<span class="note">${item.note}</span>` : '-'}</td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        alert("Something went wrong. Please try again.");
        console.error(err);
      }
    }
  </script>
</body>
</html>
