<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Available Doctor Plans</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f7f7f7;
      padding: 30px;
    }
    .card {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2 class="mb-4">Choose a Doctor Subscription Plan</h2>
  <div id="plans-container" class="row"></div>
</div>

<script>
  const token = localStorage.getItem('token');

  async function loadPlans() {
    try {
      const res = await fetch('/api/doctor/subscriptions/plans', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        }); 
      if (!res.ok) {
        const errorData = await res.json();
        throw new Error(errorData.error || "Failed to fetch plans.");
      }

      const plans = await res.json();
      if (!Array.isArray(plans)) {
        throw new Error("Invalid response from server.");
      }

      const container = document.getElementById('plans-container');
      container.innerHTML = '';

      plans.forEach(plan => {
        const col = document.createElement('div');
        col.className = 'col-md-4';

        col.innerHTML = `
          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title">${plan.name}</h5>
              <p class="text-muted">${plan.description || ''}</p>
              <p><strong>Monthly:</strong> ${plan.monthly_price} ${plan.currency || 'SAR'}</p>
              <p><strong>Yearly:</strong> ${plan.yearly_price} ${plan.currency || 'SAR'}</p>
              <pre class="bg-light p-2 small rounded">${JSON.stringify(plan.features, null, 2)}</pre>
              <button class="btn btn-primary me-2" onclick="subscribe(${plan.id}, 'monthly')">Subscribe Monthly</button>
              <button class="btn btn-outline-primary" onclick="subscribe(${plan.id}, 'yearly')">Subscribe Yearly</button>
            </div>
          </div>
        `;

        container.appendChild(col);
      });

    } catch (err) {
      console.error("Fetch error:", err);
      alert(err.message || "An unexpected error occurred while loading plans.");
    }
  }

  async function subscribe(planId, billingCycle) {
    const token = localStorage.getItem('token');
    if (!token) {
      return alert("You must be logged in.");
    }

    const paperwork_url = prompt("Enter your paperwork URL:");
    if (!paperwork_url) return alert("Paperwork URL is required.");

    const res = await fetch('/api/doctor/subscriptions/subscribe', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({
        plan_id: planId,
        billing_cycle: billingCycle,
        paperwork_url
      })
    });

    const data = await res.json();
    if (!res.ok) return alert(data.error || "Subscription failed.");

    const approvalLink = data.links?.find(link => link.rel === 'approve');
    if (approvalLink) {
      window.location.href = approvalLink.href;
    } else {
      alert("PayPal approval link not found.");
    }
  }

  loadPlans();
</script>
</body>
</html>
