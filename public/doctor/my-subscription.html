<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Subscription</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f2f2f2;
      padding: 30px;
    }
    .card {
      max-width: 700px;
      margin: auto;
    }
    pre {
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

<div class="container">
  <h2 class="mb-4 text-center">My Current Subscription</h2>
  <div id="subscription-card"></div>
</div>

<script>
  const token = localStorage.getItem('token');

  async function loadSubscription() {
    try {
      const res = await fetch('/api/doctor/subscriptions/current', {
        headers: {
          'Authorization': `Bearer ${token}`
        }
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed to fetch subscription.");

      const card = document.getElementById('subscription-card');
      card.innerHTML = `
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">${data.plan_name}</h5>
            <p class="text-muted"><strong>Status:</strong> ${data.status}</p>
            <p><strong>Billing Cycle:</strong> ${data.billing_cycle}</p>
            <p><strong>Start Date:</strong> ${data.start_date || 'N/A'}</p>
            <p><strong>End Date:</strong> ${data.end_date || 'N/A'}</p>
            <p><strong>Monthly Price:</strong> ${data.monthly_price} ${data.currency || 'SAR'}</p>
            <p><strong>Yearly Price:</strong> ${data.yearly_price} ${data.currency || 'SAR'}</p>
            <hr />
            <h6>Features:</h6>
            <pre class="bg-light p-2 rounded small">${JSON.stringify(data.features, null, 2)}</pre>
          </div>
        </div>
      `;

    } catch (err) {
      console.error("Fetch error:", err);
      alert(err.message || "An error occurred while loading your subscription.");
    }
  }

  loadSubscription();
</script>

</body>
</html>
